<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MR2525 报价计算器</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1a2333; --sub:#6b7686;
    --accent:#111111; --accent-soft:#f2f2f2; --line:#e6eaf1;
    --chip:#f1f4f9; --radius:14px; --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.55;
    display:flex; justify-content:center; min-height:100vh;
  }
  .wrap{width:100%; max-width:480px; padding:14px 14px 44px;}
  header{margin:6px 2px 14px;}
  header h1{font-size:19px; margin:0; letter-spacing:.5px;}
  header .ver{font-size:11px; color:var(--sub); margin-top:2px;}
  .card{
    background:var(--card); border-radius:var(--radius);
    border:1px solid var(--line); box-shadow:0 1px 3px rgba(20,30,60,.05);
    padding:18px 16px; margin-bottom:12px;
  }
  .card h2{font-size:13px; color:var(--sub); font-weight:600; margin:0 0 10px; letter-spacing:1px;}
  label.field{display:block; margin-bottom:10px;}
  label.field span{display:block; font-size:12px; color:var(--sub); margin-bottom:4px;}
  .row{display:flex; gap:10px;}
  .row>*{flex:1;}
  input[type=number], input[type=text], select{
    width:100%; padding:10px; border:1px solid var(--line); border-radius:9px;
    font-size:16px; background:#fbfcfe; color:var(--ink); outline:none;
    transition:border-color .15s var(--ease), background .15s var(--ease), box-shadow .15s var(--ease);
  }
  input:focus, select:focus{border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px rgba(0,0,0,.08);}
  .hint{font-size:11px; color:var(--sub); margin-top:8px;}
  .rows .r{display:flex; gap:4px 14px; align-items:baseline; padding:9px 0; border-bottom:1px dashed var(--line); font-size:14px;}
  .rows .r:last-child{border-bottom:none;}
  .rows .r .k{flex:1; min-width:0; color:var(--sub); line-height:1.45;}
  .rows .r .v{white-space:nowrap; text-align:right; font-weight:500; color:var(--ink); font-variant-numeric:tabular-nums;}
  .hero{text-align:center; padding:10px 0 6px;}
  .hero .big{font-size:40px; font-weight:700; letter-spacing:-.5px; color:var(--accent); font-variant-numeric:tabular-nums;}
  .hero .big small{font-size:14px; color:var(--sub); font-weight:400;}
  .hero .cap{font-size:12px; color:var(--sub); margin-top:2px;}
  .hero .sub{font-size:13px; color:var(--sub); margin-top:6px;}
  .btn{
    display:block; width:100%; padding:12px; margin-top:12px;
    border:none; border-radius:10px; background:var(--accent); color:#fff;
    font-size:15px; font-weight:600; cursor:pointer;
    transition:transform .12s var(--ease), opacity .15s var(--ease);
  }
  .btn:active{transform:scale(.985); opacity:.9;}
  .btn.ghost{background:var(--accent-soft); color:var(--accent);}
  .btn:disabled{opacity:.45;}
  /* Tab 栏 */
  .tabs{display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; padding:7px 14px; border-radius:999px; background:var(--chip);
    color:var(--ink); font-size:13px; cursor:pointer; border:1px solid transparent;
    user-select:none; transition:background .15s var(--ease), color .15s var(--ease);
  }
  .tab.on{background:var(--ink); color:#fff; font-weight:600;}
  .tab .n{font-size:10px; opacity:.65; margin-left:3px;}
  .catbar{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12px; color:var(--sub); padding:10px 2px 8px; border-bottom:1px solid var(--line);
  }
  .catbar b{color:var(--ink); font-variant-numeric:tabular-nums;}
  /* 双列卡片网格 */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding-top:10px;}
  .item{
    position:relative; border:1px solid var(--line); border-radius:12px;
    background:#fbfcfe; padding:10px 12px; cursor:pointer;
    transition:border-color .15s var(--ease), background .15s var(--ease);
  }
  .item.sel{border-color:var(--accent); background:var(--accent-soft);}
  .item .nm{
    font-size:13px; font-weight:600; line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:18px;
  }
  .item .spec{font-size:10px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item .pr{font-size:15px; font-weight:700; color:var(--ink); margin-top:6px; font-variant-numeric:tabular-nums;}
  .item .pr small{font-size:10px; color:var(--sub); font-weight:400;}
  .item.sel .pr{color:var(--accent);}
  .item .qb{
    position:absolute; top:8px; right:8px; min-width:18px; height:18px; line-height:18px;
    border-radius:999px; background:var(--accent); color:#fff; font-size:11px;
    text-align:center; padding:0 4px; display:none; font-variant-numeric:tabular-nums;
  }
  .item.sel .qb{display:block;}
  .item .ctl{display:flex; justify-content:flex-end; margin-top:8px;}
  .stepper{display:flex; align-items:center; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:#fff;}
  .stepper button{
    width:30px; height:30px; border:none; background:var(--chip); color:var(--ink);
    font-size:17px; cursor:pointer; line-height:1;
    transition:background .15s var(--ease), color .15s var(--ease);
  }
  .stepper button:active{background:var(--accent-soft); color:var(--accent);}
  .stepper .q{
    width:34px; text-align:center; font-size:13px; font-weight:600;
    border-left:1px solid var(--line); border-right:1px solid var(--line); line-height:30px;
  }
  .arearow{display:flex; align-items:center; gap:6px; margin-top:8px;}
  .areain{
    flex:1; min-width:0; padding:6px 8px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; background:#fff; outline:none; font-variant-numeric:tabular-nums;
  }
  .areain:focus{border-color:var(--accent); background:#fff;}
  .arearow .u{font-size:11px; color:var(--sub); white-space:nowrap;}
  .cart .line{
    display:flex; align-items:center; gap:8px; padding:10px 0;
    border-bottom:1px dashed var(--line); font-size:13px;
  }
  .cart .line .nm{flex:1; min-width:0;}
  .cart .line .nm b{font-size:14px;}
  .cart .line .nm span{color:var(--sub); display:block; font-size:11px;}
  .cart .line .amt{text-align:right; font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; line-height:1.5;}
  .cart .line .del{border:none; background:none; color:var(--sub); font-size:16px; cursor:pointer; padding:4px;}
  .empty{font-size:13px; color:var(--sub); text-align:center; padding:14px 0;}
  #sheetWrap{margin-top:12px; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  #sheet{display:block; width:100%; height:auto;}
  footer{font-size:11px; color:var(--sub); text-align:center; line-height:1.7; padding:0 10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MR2525 报价计算器</h1>
    <div class="ver" id="verLine">价目表版本 PB-2026-10 · 型材公式 P = 2×L + 30（含 Core-lox）</div>
  </header>

  <!-- 客户编码 -->
  <div class="card">
    <h2>客户编码（选填）</h2>
    <input type="text" id="custCode" placeholder="请输入客户编码" autocomplete="off">
    <div class="hint" id="codeHint" style="display:none"></div>
  </div>

  <!-- 型材算价 -->
  <div class="card" id="calcCard">
    <h2>型材算价（英寸 / 毫米自动换算 · 任意长度定制）</h2>
    <div class="row">
      <label class="field"><span>切长（英寸）</span><input type="number" id="inch" value="8" min="0.1" step="0.01"></label>
      <label class="field"><span>切长（mm）</span><input type="number" id="mm" value="203.2" min="1" step="0.1"></label>
    </div>
    <div class="hint" style="margin-top:-4px; margin-bottom:10px">输入任一单位自动换算（1 英寸 = 25.4 mm）；价格按英寸向上取整到元</div>
    <div class="row">
      <label class="field"><span>表面工艺</span><select id="proc"></select></label>
      <label class="field"><span>颜色</span><select id="color"></select></label>
    </div>
    <div class="row">
      <label class="field"><span>数量（支）</span><input type="number" id="qty" value="1" min="1" step="1"></label>
    </div>
    <div class="rows" id="rows" style="margin-top:6px"></div>
    <div class="hero">
      <div class="cap">合计（不含税）</div>
      <div class="big"><span id="final">--</span><small> 元</small></div>
      <div class="sub" id="subline"></div>
    </div>
    <button class="btn" id="addBtn">＋ 型材加入询价单</button>
  </div>

  <!-- 配件目录 -->
  <div class="card">
    <div class="tabs" id="tabs"></div>
    <div class="catbar"><span id="catName">常用</span><span>已选 <b id="catCount">0</b> 项 · 小计 <b id="catSub">¥0.00</b></span></div>
    <div class="grid" id="grid"></div>
    <div class="hint" style="margin-top:10px">板材按平方米计价；价格依据价目表 PB-2026-10。</div>
  </div>

  <!-- 询价单 -->
  <div class="card" id="inqCard">
    <h2>询价单（自动生成）</h2>
    <div class="row">
      <label class="field"><span>联系人（选填）</span><input type="text" id="cname" placeholder="姓名"></label>
      <label class="field"><span>电话（选填）</span><input type="text" id="cphone" placeholder="手机/微信"></label>
    </div>
    <div class="cart" id="cart"><div class="empty">型材算价后点「加入询价单」；配件选了数量会自动带出</div></div>
    <div id="sheetWrap" class="hidden"><canvas id="sheet"></canvas></div>
    <button class="btn ghost hidden" id="exportBtn">一键导出图片</button>
  </div>

  <footer>
    价格按价目表 PB-2026-10 计算，仅供参考，不构成要约；成交价格以双方订单确认为准。<br>
    <a href="/pricebook.html" style="color:var(--ink); font-weight:600;">← 查看完整产品定价表</a>
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ========== 价目表 PB-2026-10（对外）· 与内部成本核算分离 ========== */
  var PROFILE = { slope: 2, base: 30 };  // P = 2L + 30, L=英寸, 已含 Core-lox 两端预埋
  var PROCESSES = ["硬质阳极氧化","静电喷粉","水性漆喷涂","热转印","磁力抛光","镀铬","本色/无处理"];
  var COLORS = ["太空银","太空灰","太空黑","午夜蓝","曜石黑","活力橙","玫瑰金","古铜金","中东金","白橡木色","黑胡桃色","冰川蓝","珍珠白","翡翠绿"];

  /* 分组目录:qty 类型 int(步进) / area(㎡, 手输) */
  var GROUPS = [
    { key:"six", name:"六通", open:true, items:[
      { sku:"OL2525",    name:"六通 OL2525",        spec:"25×25",         price:13,  unit:"个", common:true },
      { sku:"OL2550",    name:"六通 OL2550",        spec:"25×50",         price:26,  unit:"个", common:true },
      { sku:"OL2550X75", name:"重型六通 OL7575X",   spec:"75×75",         price:65,  unit:"个" },
      { sku:"OL-CUSTOM", name:"定制六通(需图纸)",    spec:"按图纸",         price:200, unit:"个" }
    ]},
    { key:"plugin", name:"插件", open:false, items:[
      { sku:"CLX-25",      name:"Core-Lox 连接件 25系列", spec:"16×14",    price:12.5, unit:"个", common:true },
      { sku:"HW-2610-004", name:"蝶形螺母",              spec:"—",        price:1.5,  unit:"个" },
      { sku:"CLX-12",      name:"Core-Lox（12个装）",    spec:"—",        price:125,  unit:"盒" },
      { sku:"LY15",        name:"4寸层板托",             spec:"MR2525 用", price:4,    unit:"个", common:true },
      { sku:"P-EYENUT",    name:"吊环螺丝",              spec:"—",        price:8,    unit:"个" },
      { sku:"P-KNUCKLE",   name:"活结螺丝",              spec:"—",        price:4,    unit:"个" },
      { sku:"P-WIREROPE",  name:"钢丝绳套件",            spec:"—",        price:20,   unit:"套" },
      { sku:"P-BRACE",     name:"斜撑杆",                spec:"—",        price:40,   unit:"根" },
      { sku:"P-CASTER",    name:"脚轮",                  spec:"—",        price:40,   unit:"个" },
      { sku:"P-FOOT",      name:"地脚",                  spec:"—",        price:10,   unit:"个" },
      { sku:"P-HINGE-S",   name:"转向合页",              spec:"—",        price:8,    unit:"个" },
      { sku:"P-TRI",       name:"三角扣",                spec:"—",        price:2.5,  unit:"个" },
      { sku:"P-TCLIP",     name:"T型吊码",               spec:"—",        price:10,   unit:"个" },
      { sku:"P-TNUT",      name:"T型螺母",               spec:"—",        price:4,    unit:"个" },
      { sku:"P-DRAWER",    name:"瓦楞纸抽屉",            spec:"—",        price:50,   unit:"个" },
      { sku:"P-LED13",     name:"模块化灯条 13″",        spec:"—",        price:50,   unit:"条" },
      { sku:"P-LED20",     name:"模块化灯条 20″",        spec:"—",        price:60,   unit:"条" },
      { sku:"P-LED27",     name:"模块化灯条 27″",        spec:"—",        price:70,   unit:"条" }
    ]},
    { key:"panel", name:"面板板材", open:false, area:true, items:[
      { sku:"BD-PMMMA",   name:"透明亚克力",      price:500, unit:"㎡" },
      { sku:"BD-FMMMA",   name:"磨砂亚克力",      price:500, unit:"㎡" },
      { sku:"BD-9MQI",    name:"9厘免漆板",       price:350, unit:"㎡" },
      { sku:"BD-18MQI",   name:"18厘免漆板",      price:450, unit:"㎡" },
      { sku:"BD-9TANJ",   name:"9厘碳晶板",       price:200, unit:"㎡" },
      { sku:"BD-9HY",     name:"9厘饰面海洋板",   price:350, unit:"㎡" },
      { sku:"BD-12HY",    name:"12厘饰面海洋板",  price:400, unit:"㎡" },
      { sku:"BD-18HY",    name:"18厘饰面海洋板",  price:450, unit:"㎡" },
      { sku:"BD-9MZ",     name:"9厘阻燃毛毡板",   price:150, unit:"㎡" }
    ]},
    { key:"kit", name:"工具与套装", open:false, items:[
      { sku:"KIT-SALES", name:"销售材料箱", spec:"样品展示 · 随身套装", price:599, unit:"套" },
      { sku:"KIT-TOOL",  name:"安装工具包", spec:"一把电钻完成组装",     price:199, unit:"套" }
    ]}
  ];
  /* 平铺索引 */
  var ALL = [];
  GROUPS.forEach(function(g){ g.items.forEach(function(it){ it.group = g.name; it.area = !!g.area; it.qty = 0; ALL.push(it); }); });

  var $ = function(id){ return document.getElementById(id); };
  var fmt = function(n){ return n.toFixed(2); };
  var profilePrice = function(mm){
    var p = PROFILE.slope * (mm / 25.4) + PROFILE.base;
    return Math.ceil(+p.toFixed(6));   // 向上取整到元(先消浮点噪声,防 48.00000001→127)
  };

  var cart = [];
  var sheetNo = "INQ-" + (function(){
    var d = new Date(), p = function(n){ return n < 10 ? "0" + n : "" + n; };
    return "" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" +
      Math.random().toString(36).slice(2, 6).toUpperCase();
  })();

  /* ---------- 表面选择 ---------- */
  PROCESSES.forEach(function(o, i){ $("proc").appendChild(new Option(o, o, false, i === 0)); });
  COLORS.forEach(function(o, i){ $("color").appendChild(new Option(o, o, false, i === 0)); });
  var surfaceText = function(){ return $("proc").value + " · " + $("color").value; };

  /* ---------- 英寸/mm 双向换算 ---------- */
  var syncing = false;
  $("inch").addEventListener("input", function(){
    if(syncing) return; syncing = true;
    var v = parseFloat(this.value);
    if(v > 0) $("mm").value = (v * 25.4).toFixed(1);
    syncing = false; calc();
  });
  $("mm").addEventListener("input", function(){
    if(syncing) return; syncing = true;
    var v = parseFloat(this.value);
    if(v > 0) $("inch").value = (v / 25.4).toFixed(2);
    syncing = false; calc();
  });

  var picked = function(){ return ALL.filter(function(it){ return it.qty > 0; }); };
  var pickedSub = function(){ return picked().reduce(function(a, it){ return a + it.price * it.qty; }, 0); };

  /* ---------- 目录渲染(Tab + 双列卡片) ---------- */
  var TABS = [{ key: "_common", name: "常用" }].concat(
    GROUPS.map(function(g){ return { key: g.key, name: g.name }; })
  );
  var activeTab = "_common";
  function itemsOfTab(key){
    if(key === "_common") return ALL.filter(function(it){ return it.common; });
    var g = GROUPS.find(function(x){ return x.key === key; });
    return g ? g.items : [];
  }
  function itemCard(it){
    var el = document.createElement("div");
    el.className = "item" + (it.qty > 0 ? " sel" : "");
    el.setAttribute("data-sku", it.sku);
    var specLine = it.area ? it.sku : (it.sku + " · " + it.spec);
    el.innerHTML = '<div class="qb">' + (it.qty || 0) + '</div>'
      + '<div class="nm">' + it.name + '</div>'
      + '<div class="spec">' + specLine + '</div>'
      + '<div class="pr">¥' + fmt(it.price) + '<small> /' + it.unit + '</small></div>'
      + (it.area
        ? '<div class="arearow"><input type="number" class="areain" min="0" step="0.1" placeholder="数量" value="' + (it.qty || "") + '"><span class="u">㎡</span></div>'
        : '<div class="ctl"><div class="stepper"><button data-d="-1">−</button><div class="q">' + (it.qty || 0) + '</div><button data-d="1">＋</button></div></div>');
    if(it.area){
      el.querySelector(".areain").addEventListener("input", function(e){
        e.stopPropagation();
        it.qty = Math.max(0, parseFloat(this.value) || 0);
        refreshItem(el, it);
        calc();
      });
    } else {
      el.querySelectorAll("button").forEach(function(b){
        b.addEventListener("click", function(e){
          e.stopPropagation();
          it.qty = Math.max(0, (it.qty || 0) + parseInt(b.getAttribute("data-d"), 10));
          refreshItem(el, it);
          calc();
        });
      });
    }
    return el;
  }
  function refreshItem(el, it){
    el.classList.toggle("sel", it.qty > 0);
    var q = el.querySelector(".q"); if(q) q.textContent = it.qty || 0;
    var qb = el.querySelector(".qb"); qb.textContent = it.qty || 0;
    var ai = el.querySelector(".areain");
    if(ai && document.activeElement !== ai) ai.value = it.qty || "";
  }
  function renderTabs(){
    var box = $("tabs"); box.innerHTML = "";
    TABS.forEach(function(t){
      var n = itemsOfTab(t.key).filter(function(it){ return it.qty > 0; }).length;
      var el = document.createElement("div");
      el.className = "tab" + (t.key === activeTab ? " on" : "");
      el.innerHTML = t.name + (n ? '<span class="n">' + n + '</span>' : "");
      el.addEventListener("click", function(){
        activeTab = t.key;
        renderTabs(); renderGrid();
      });
      box.appendChild(el);
    });
  }
  function renderGrid(){
    var grid = $("grid"); grid.innerHTML = "";
    itemsOfTab(activeTab).forEach(function(it){ grid.appendChild(itemCard(it)); });
    var pk = picked();
    $("catName").textContent = TABS.find(function(t){ return t.key === activeTab; }).name;
    $("catCount").textContent = pk.length;
    $("catSub").textContent = "¥" + fmt(pk.reduce(function(a, it){ return a + it.price * it.qty; }, 0));
  }
  renderTabs(); renderGrid();
  /* 数量变化后的轻量刷新:tab 计数 + 汇总条 + 当前网格卡片状态(不重建 DOM,保输入焦点) */
  function softRefresh(){
    renderTabs();
    var pk = picked();
    $("catName").textContent = TABS.find(function(t){ return t.key === activeTab; }).name;
    $("catCount").textContent = pk.length;
    $("catSub").textContent = "¥" + fmt(pk.reduce(function(a, it){ return a + it.price * it.qty; }, 0));
    document.querySelectorAll("#grid .item").forEach(function(el){
      var it = ALL.find(function(x){ return x.sku === el.getAttribute("data-sku"); });
      if(it) refreshItem(el, it);
    });
  }
  var _calc = calc;
  calc = function(){ softRefresh(); _calc(); };

  /* ---------- 客户编码 → 专属折扣 ---------- */
  var appliedDisc = 1, codeTimer = null;
  function applyCode(code){
    var hint = $("codeHint");
    if(!code){ appliedDisc = 1; hint.textContent = ""; hint.style.color = ""; hint.style.display = "none"; calc(); return; }
    fetch("/api/public/price-code?code=" + encodeURIComponent(code))
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        if(j && j.code === 0 && j.data && j.data.valid){
          appliedDisc = j.data.discount;
          hint.textContent = "✓ 已启用您的专属价格";
          hint.style.color = "#0e9f6e"; hint.style.display = "";
        } else {
          appliedDisc = 1;
          hint.textContent = "编码未识别";
          hint.style.color = "#dc2626"; hint.style.display = "";
        }
        calc();
      })
      .catch(function(){ appliedDisc = 1; calc(); });
  }
  $("custCode").addEventListener("input", function(){
    clearTimeout(codeTimer);
    var code = this.value.trim();
    codeTimer = setTimeout(function(){ applyCode(code); }, 500);
  });

  /* ---------- 算价 ---------- */
  function inputs(){
    return {
      mm: parseFloat($("mm").value) || 0,
      inch: parseFloat($("inch").value) || 0,
      qty: Math.max(0, Math.round(parseFloat($("qty").value) || 0)),
      disc: appliedDisc
    };
  }
  function calc(){
    var v = inputs();
    var sub = pickedSub();
    var ok = v.mm > 0 && v.qty > 0;
    $("addBtn").disabled = !ok;

    var rows = "", list = 0, final = 0;
    if(ok){
      var unit = profilePrice(v.mm), line = unit * v.qty;
      list = line + sub; final = list * v.disc;
      rows += '<div class="r"><span class="k">型材（含 Core-lox · ' + surfaceText() + '）</span><span class="v">'
        + unit + ' 元/支 × ' + v.qty + ' 支 ＝ ' + fmt(line) + ' 元</span></div>';
    }
    picked().forEach(function(it){
      rows += '<div class="r"><span class="k">' + it.name + '</span><span class="v">' + fmt(it.price)
        + ' 元/' + it.unit + ' × ' + it.qty + ' ＝ ' + fmt(it.price * it.qty) + ' 元</span></div>';
    });
    if(ok || sub > 0){
      rows += '<div class="r"><span class="k">合计</span><span class="v">' + fmt(list) + ' 元</span></div>';
      $("final").textContent = fmt(final);
      $("subline").textContent = "含税合计 " + fmt(final * 1.1) + " 元（×1.1）"
        + (ok ? " · 型材单价 " + fmt(profilePrice(v.mm)) + " 元/支" : "");
    } else {
      $("final").textContent = "--"; $("subline").textContent = "";
    }
    $("rows").innerHTML = rows;
    renderSheet();
  }
  ["qty"].forEach(function(id){ $(id).addEventListener("input", calc); });

  /* ---------- 询价单行项 ---------- */
  $("addBtn").addEventListener("click", function(){
    var v = inputs();
    if(v.mm <= 0 || v.qty <= 0) return;
    var inchStr = (v.inch % 1 === 0 ? v.inch + "寸" : v.inch.toFixed(2) + "寸");
    cart.push({
      name: "MR2525 定尺件 · " + inchStr + "（" + v.mm.toFixed(1) + " mm）",
      sub: "含 Core-lox · 表面 " + surfaceText() + " · " + profilePrice(v.mm) + " 元/支",
      qty: v.qty, unit: profilePrice(v.mm), unitLabel: "支"
    });
    renderSheet();
    $("inqCard").scrollIntoView({ behavior: "smooth" });
  });
  ["cname","cphone"].forEach(function(id){ $(id).addEventListener("input", renderSheet); });
  function removeHw(sku){
    var it = ALL.find(function(x){ return x.sku === sku; });
    if(!it) return;
    it.qty = 0;
    renderTabs(); renderGrid();
    calc();
  }

  function renderSheet(){
    var box = $("cart");
    var hw = picked();
    var hasLines = cart.length > 0 || hw.length > 0;
    box.innerHTML = "";
    if(!hasLines){
      box.innerHTML = '<div class="empty">型材算价后点「加入询价单」；配件选了数量会自动带出</div>';
      $("sheetWrap").classList.add("hidden");
      $("exportBtn").classList.add("hidden");
      return;
    }
    cart.forEach(function(it, i){
      var el = document.createElement("div");
      el.className = "line";
      el.innerHTML = '<div class="nm"><b>' + it.name + '</b><span>' + it.sub + '</span></div>'
        + '<div class="amt">×' + it.qty + '<br>' + fmt(it.unit * it.qty) + ' 元</div>'
        + '<button class="del" title="删除">✕</button>';
      el.querySelector(".del").onclick = function(){ cart.splice(i, 1); renderSheet(); };
      box.appendChild(el);
    });
    hw.forEach(function(it){
      var el = document.createElement("div");
      el.className = "line";
      el.innerHTML = '<div class="nm"><b>' + it.name + '</b><span>' + it.sku + ' · '
        + fmt(it.price) + ' 元/' + it.unit + '</span></div>'
        + '<div class="amt">×' + it.qty + '<br>' + fmt(it.price * it.qty) + ' 元</div>'
        + '<button class="del" title="移除">✕</button>';
      el.querySelector(".del").onclick = function(){ removeHw(it.sku); };
      box.appendChild(el);
    });
    $("sheetWrap").classList.remove("hidden");
    $("exportBtn").classList.remove("hidden");
    drawSheet();
  }

  /* ---------- 询价单绘制 ---------- */
  function drawSheet(){
    var v = inputs();
    var hw = picked();
    if(cart.length === 0 && hw.length === 0) return;

    var S = 2, W = 750, m = 48, rowH = 42, headH = 40;
    var lines = cart.map(function(it){ return { name: it.name, sub: it.sub, qty: it.qty, unit: it.unit, unitLabel: it.unitLabel }; })
      .concat(hw.map(function(it){
        return { name: it.name, sub: it.sku + " · " + fmt(it.price) + " 元/" + it.unit,
                 qty: it.qty, unit: it.price, unitLabel: it.unit };
      }));

    var list = lines.reduce(function(a, it){ return a + it.unit * it.qty; }, 0);
    var final = list * v.disc;
    var d = new Date(), p = function(n){ return n < 10 ? "0" + n : "" + n; };
    var dateStr = d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());

    var H = 118 + 30 + 14 + headH + lines.length * rowH + 18 + 4 * 28 + 64;
    var c = $("sheet");
    c.width = W * S; c.height = H * S; c.style.width = "100%";
    var x = c.getContext("2d");
    x.scale(S, S);
    x.fillStyle = "#ffffff"; x.fillRect(0, 0, W, H);
    x.textBaseline = "middle";

    var F = function(sz, w, col){ x.font = (w ? w + " " : "") + sz + 'px "PingFang SC","Microsoft YaHei",sans-serif'; x.fillStyle = col || "#1a2333"; };

    F(30, "bold"); x.textAlign = "center"; x.fillText("询 价 单", W / 2, 52);
    F(13, "", "#6b7686");
    x.textAlign = "left"; x.fillText("单号：" + sheetNo, m, 96);
    x.textAlign = "right"; x.fillText("日期：" + dateStr, W - m, 96);
    x.strokeStyle = "#e6eaf1"; x.beginPath(); x.moveTo(m, 112); x.lineTo(W - m, 112); x.stroke();

    x.textAlign = "left"; F(13, "", "#6b7686");
    var nm = $("cname").value.trim() || "＿＿＿＿", ph = $("cphone").value.trim() || "＿＿＿＿＿＿＿＿";
    x.fillText("联系人：" + nm + "　　电话：" + ph, m, 136);

    var ty = 160;
    x.fillStyle = "#f1f4f9"; x.fillRect(m, ty, W - m * 2, headH);
    F(12, "600", "#6b7686");
    var cols = [
      [m + 12, "#", "l"], [m + 46, "品名与规格", "l"], [W - m - 258, "数量", "r"],
      [W - m - 168, "单价(元)", "r"], [W - m - 12, "小计(元)", "r"]
    ];
    cols.forEach(function(cl){ x.textAlign = cl[2]; x.fillText(cl[1], cl[0], ty + headH / 2); });
    ty += headH;
    lines.forEach(function(it, i){
      var cy = ty + rowH / 2 + i * rowH;
      var qtyTxt = it.qty + " " + it.unitLabel;
      x.textAlign = "left";
      F(14); x.fillText(String(i + 1), m + 12, cy - 8);
      F(14, "600"); x.fillText(it.name, m + 46, cy - 8);
      F(11, "", "#6b7686"); x.fillText(it.sub, m + 46, cy + 11);
      x.textAlign = "right";
      F(14); x.fillText(qtyTxt, W - m - 258, cy - 8);
      x.fillText(fmt(it.unit), W - m - 168, cy - 8);
      F(14, "600"); x.fillText(fmt(it.unit * it.qty), W - m - 12, cy - 8);
      x.strokeStyle = "#eef0f5"; x.beginPath(); x.moveTo(m, ty + (i + 1) * rowH); x.lineTo(W - m, ty + (i + 1) * rowH); x.stroke();
    });
    ty += lines.length * rowH + 18;

    var totals = [
      ["合计", fmt(list) + " 元", false]
    ];
    if(v.disc < 1) totals.push(["专属价格", Math.round(v.disc * 100) + " %", false]);
    totals.push(["应付合计（不含税）", fmt(final) + " 元", true]);
    totals.push(["含税合计（×1.1）", fmt(final * 1.1) + " 元", false]);
    totals.forEach(function(t, i){
      var cy = ty + 14 + i * 28;
      x.textAlign = "right";
      F(t[2] ? 16 : 13, t[2] ? "600" : "", t[2] ? "#2b5cff" : "#6b7686");
      x.fillText(t[0], W - m - 150, cy);
      F(t[2] ? 18 : 14, t[2] ? "bold" : "", t[2] ? "#2b5cff" : "#1a2333");
      x.fillText(t[1], W - m - 12, cy);
    });

    x.textAlign = "center"; F(11, "", "#9aa3b2");
    x.fillText("本询价单由报价计算器生成 · 价格以订单确认为准", W / 2, H - 36);
    x.fillText("价目表版本 PB-2026-10 · 型材公式 P=2L+30（含 Core-lox）", W / 2, H - 18);
  }

  /* ---------- 导出图片 ---------- */
  $("exportBtn").addEventListener("click", function(){
    var c = $("sheet");
    c.toBlob(function(blob){
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "询价单_" + sheetNo + ".png";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
    }, "image/png");
  });

  calc();
})();
</script>
</body>
</html>
